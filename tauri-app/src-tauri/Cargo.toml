[package]
name = "novastudiocast"
version = "0.1.4"
edition = "2021"
description = "NovaStudioCast, lokale und ressourcenschonende Pipeline für automatisierte Videoproduktion von KI-WERKE"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
# Für den Zeitstempel im Render Manifest (manifest.rs), einzige neue
# Abhängigkeit gegenüber NovaPhonic.
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
# Für die lokale Chat KI Anbindung (chat/client.rs): reines HTTP zu einer
# bereits vom Nutzer laufenden Ollama Instanz auf localhost, kein eigenes
# Tauri Plugin nötig, weil ausschließlich von Rust Code aus aufgerufen,
# nie direkt vom Frontend. "stream" für den Modell Download Fortschritt
# (/api/pull), "json" für die eigentlichen Anfragen/Antworten.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"

[[bin]]
name = "novastudiocast"
path = "src/main.rs"
