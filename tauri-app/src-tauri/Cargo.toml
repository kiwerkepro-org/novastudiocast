[package]
name = "novastudiocast"
version = "0.1.0"
edition = "2021"
description = "NovaStudioCast, lokale und ressourcenschonende Pipeline für automatisierte Videoproduktion von KI-WERKE"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
# Für den Zeitstempel im Render Manifest (manifest.rs), einzige neue
# Abhängigkeit gegenüber NovaPhonic.
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"

[[bin]]
name = "novastudiocast"
path = "src/main.rs"
